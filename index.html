<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KashSight - P2P Lending</title>
    <style>
      #global-error-display {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px;
        background-color: #fee2e2;
        color: #991b1b;
        z-index: 99999;
        font-family: monospace;
        border-bottom: 2px solid #ef4444;
      }
    </style>
    <script>
      // 1. Global Error Handler: Catches errors before React mounts to prevent "White Screen of Death"
      window.addEventListener('error', function(event) {
        var display = document.getElementById('global-error-display');
        if (display) {
          display.style.display = 'block';
          display.innerText = 'System Error: ' + event.message;
        }
        console.error("Global Error Caught:", event.error);
      });

      // 2. Process Polyfill: Essential for libraries expecting Node.js environment
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      window.process.env.NODE_ENV = window.process.env.NODE_ENV || 'production';
      window.process.env.API_KEY = window.process.env.API_KEY || ''; 
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
