      tailwind.config = {
        theme: {

    <!-- jsPDF CDN -->

      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
    <!-- Error Trap for White Screen Debugging -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        // Ignore resize observer errors which are common and harmless
        if(msg && typeof msg === 'string' && msg.includes('ResizeObserver')) return;
        
        const div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;width:100%;z-index:99999;background:white;color:red;padding:20px;font-family:monospace;border-bottom:2px solid black;';
        div.innerHTML = '<strong>App Error:</strong> ' + msg + '<br><small>' + url + ':' + line + '</small>';
        document.body.appendChild(div);
      };
    </script>
